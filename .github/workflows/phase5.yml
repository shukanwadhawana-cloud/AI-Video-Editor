name: Phase 5 Local Whisper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  phase5-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke — iPad Phase 5 local Whisper transcription contract
        run: npx tsx apps/ipad/scripts/smoke-phase5.ts
