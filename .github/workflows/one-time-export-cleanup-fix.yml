name: One-time export cleanup fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-export-cleanup-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cancellation cleanup retry window
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/engine.ts')
          s = p.read_text()
          old = 'for (let attempt = 0; attempt < 5; attempt++) {'
          new = 'for (let attempt = 0; attempt < 50; attempt++) {'
          if old not in s:
              raise SystemExit('expected cleanup loop not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/one-time-export-cleanup-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/engine.ts .github/workflows/one-time-export-cleanup-fix.yml
          git commit -m 'Fix export cancellation cleanup retry window'
          git push
